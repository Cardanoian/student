<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>행동누가기록</title>

    <!-- 파비콘 등록 -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- 폰트 불러오기 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-dark: #0a0c0f;
        --panel-bg: rgba(16, 20, 26, 0.9);
        --neon-green: #39ff14;
        --neon-cyan: #00f0ff;
        --neon-pink: #ff0055;
        --text-main: #d0d7de;
        --text-dim: #5c6370;
        --border-color: #1e2633;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-dark);
        background-image:
          radial-gradient(
            circle at 50% 20%,
            rgba(0, 240, 255, 0.05) 0%,
            transparent 50%
          ),
          linear-gradient(rgba(0, 0, 0, 0.7) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.7) 1px, transparent 1px);
        background-size:
          100%,
          20px 20px,
          20px 20px;
        color: var(--text-main);
        font-family: 'Share Tech Mono', 'Noto Sans KR', monospace;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .terminal-container {
        width: 100%;
        max-width: 580px;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-top: 3px solid var(--neon-cyan);
        box-shadow:
          0 0 25px rgba(0, 240, 255, 0.15),
          inset 0 0 15px rgba(0, 0, 0, 0.8);
        border-radius: 4px;
        padding: 24px;
        position: relative;
        backdrop-filter: blur(5px);
      }

      /* 상단 상태 바 */
      .terminal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px dashed var(--border-color);
        padding-bottom: 12px;
        margin-bottom: 20px;
      }

      .terminal-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--neon-cyan);
        text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-badge {
        font-size: 0.75rem;
        color: var(--neon-green);
        border: 1px solid var(--neon-green);
        padding: 2px 6px;
        border-radius: 2px;
        box-shadow: 0 0 5px rgba(57, 255, 20, 0.3);
      }

      /* 폼 요소 */
      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        color: var(--text-dim);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      select,
      textarea {
        width: 100%;
        background: #0f141c;
        border: 1px solid #283344;
        color: #fff;
        font-family: inherit;
        padding: 12px;
        border-radius: 3px;
        outline: none;
        transition: all 0.25s ease;
      }

      select:focus,
      textarea:focus {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      }

      textarea {
        resize: vertical;
        min-height: 120px;
        line-height: 1.5;
      }

      /* 액션 버튼 */
      .btn-submit {
        width: 100%;
        background: transparent;
        color: var(--neon-pink);
        border: 1px solid var(--neon-pink);
        padding: 14px;
        font-size: 1rem;
        font-weight: bold;
        font-family: inherit;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }

      .btn-submit:hover:not(:disabled) {
        background: var(--neon-pink);
        color: #000;
        box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
      }

      .btn-submit:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        border-color: var(--text-dim);
        color: var(--text-dim);
        box-shadow: none;
      }

      /* 상태 알림창 */
      .status-log {
        margin-top: 18px;
        padding: 10px;
        font-size: 0.85rem;
        background: rgba(0, 0, 0, 0.5);
        border-left: 3px solid var(--text-dim);
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-log.success {
        border-color: var(--neon-green);
        color: var(--neon-green);
      }

      .status-log.error {
        border-color: var(--neon-pink);
        color: var(--neon-pink);
      }
    </style>
  </head>
  <body>
    <div class="terminal-container">
      <div class="terminal-header">
        <div class="terminal-title">☢ BEHAVIOR LOGGER</div>
        <div class="status-badge" id="netStatus">CONNECTING...</div>
      </div>

      <form id="recordForm">
        <div class="form-group">
          <label for="studentSelect">// 대상 학생 선택 (TARGET)</label>
          <select id="studentSelect" required disabled>
            <option value="">데이터를 불러오는 중입니다...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="recordInput">// 관찰 기록 (RECORD LOG)</label>
          <textarea
            id="recordInput"
            placeholder="행동 특이사항 및 관찰 내용을 입력하십시오..."
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn" disabled>
          기록 전송 [TRANSMIT]
        </button>
      </form>

      <div class="status-log" id="statusLog">
        <span>SYSTEM READY. 대상 목록 대기 중.</span>
      </div>
    </div>

    <script>
      // ⚙️ 여기에 Apps Script 웹앱 URL을 꼭 붙여넣어 주세요!
      const GAS_WEB_APP_URL = '여기에_배포된_웹앱_URL을_넣으세요';

      const studentSelect = document.getElementById('studentSelect');
      const recordInput = document.getElementById('recordInput');
      const submitBtn = document.getElementById('submitBtn');
      const statusLog = document.getElementById('statusLog');
      const netStatus = document.getElementById('netStatus');

      // 로그 메시지 출력 함수
      function log(msg, type = '') {
        statusLog.textContent = `> ${msg}`;
        statusLog.className = `status-log ${type}`;
      }

      // 1. 학생 목록 불러오기 (GET)
      async function loadStudents() {
        try {
          log('학생 명렬 동기화 중...', '');
          const response = await fetch(GAS_WEB_APP_URL);
          const result = await response.json();

          if (result.status === 'success' && result.data.length > 0) {
            studentSelect.innerHTML =
              '<option value="">-- 학생을 선택하세요 --</option>';
            result.data.forEach((st) => {
              const opt = document.createElement('option');
              opt.value = JSON.stringify({ number: st.number, name: st.name });
              opt.textContent = `[${st.number}번] ${st.name}`;
              studentSelect.appendChild(opt);
            });

            studentSelect.disabled = false;
            submitBtn.disabled = false;
            netStatus.textContent = 'ONLINE';
            log('동기화 완료. 학생을 선택해 주세요.', 'success');
          } else {
            throw new Error('명렬 데이터가 비어있습니다.');
          }
        } catch (err) {
          log('데이터 로드 실패: ' + err.message, 'error');
          netStatus.textContent = 'OFFLINE';
        }
      }

      // 2. 누가기록 저장하기 (POST)
      document
        .getElementById('recordForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();

          const selectedValue = studentSelect.value;
          const recordText = recordInput.value.trim();

          if (!selectedValue || !recordText) {
            log('대상 학생과 기록 내용을 모두 확인하세요.', 'error');
            return;
          }

          const student = JSON.parse(selectedValue);
          const payload = {
            number: student.number,
            name: student.name,
            record: recordText,
          };

          // 버튼 잠금 및 안내
          submitBtn.disabled = true;
          submitBtn.textContent = '전송 중... [UPLOADING]';
          log('중앙 서버로 데이터를 전송하고 있습니다...', '');

          try {
            const res = await fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload),
            });

            const resData = await res.json();

            if (resData.status === 'success') {
              log(
                `[완료] ${student.name} 학생의 기록이 저장되었습니다.`,
                'success',
              );
              recordInput.value = ''; // 입력창 초기화
            } else {
              throw new Error(resData.message);
            }
          } catch (err) {
            log('전송 오류 발생: ' + err.message, 'error');
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '기록 전송 [TRANSMIT]';
          }
        });

      // 시작 시 명렬 자동 조회
      loadStudents();
    </script>
  </body>
</html>
